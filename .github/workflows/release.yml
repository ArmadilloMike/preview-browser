name: Build and Release Windows Files
on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv sync --locked

      - name: Build the link handler
        run: uv run pyinstaller link-handler.spec --noconfirm

      - name: Build the preview browser
        run: uv run pyinstaller preview-browser.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" preview-browser.iss

      - name: Package exes and generate hashes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          
          # Copy installer and zip both PyInstaller dist directories
          Copy-Item "Output\previewbrowser.exe" -Destination "release-assets\"
          Compress-Archive -Path "dist\link-handler\*" -DestinationPath "release-assets\link-handler-win64.zip"
          Compress-Archive -Path "dist\preview-browser\*" -DestinationPath "release-assets\preview-browser-win64.zip"
          
          # Snapshot the files first so SHA256SUMS.txt isn't hashed while being written
          $files = Get-ChildItem "release-assets\*" -File
          $files | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -FilePath "release-assets\SHA256SUMS.txt" -Encoding utf8

      - name: Rename installer file
        shell: pwsh
        run: Rename-Item -Path "release-assets\previewbrowser.exe" -NewName "preview-browser-installer.exe"

      - name: Upload files to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/preview-browser-installer.exe
            release-assets/link-handler-win64.zip
            release-assets/preview-browser-win64.zip
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ### Downloads
            ### Windows Installer
            * **`preview-browser-installer.exe`** - Per-user installer. Installs to `%LocalAppData%\Programs\Preview Browser` and also registers itself in the default app selection screen in windows settings.
            ### Portable Releases
            * **`link-handler-win64.zip`** - Portable archive for the link handler portion of the app, no preview browser bundled
            * **`preview-browser-win64.zip`** - Portable archive for the preview browser only, pass URLs with the --url flag
            
            ### Verify Checksums
            Verify your download against `SHA256SUMS.txt`:
            ```powershell
            Get-FileHash .\previewbrowser.exe -Algorithm SHA256
            ```